<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion des présences</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16358f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --bleu:#16358f; --bleu-fonce:#0c1f5c; --or:#e3b72f; --creme:#f6f3ea; --texte:#14204a; --blanc:#fff;
  --fond:var(--creme); --carte:#fff; --ligne:#d9d4c4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#0b1740;--carte:#13245f;--texte:#eef0fa;--ligne:#2a3c80}}
:root[data-theme="dark"]{--fond:#0b1740;--carte:#13245f;--texte:#eef0fa;--ligne:#2a3c80}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--fond);color:var(--texte);font:400 1rem/1.55 'Nunito',system-ui,sans-serif}
.entete{background:var(--bleu);color:var(--blanc);text-align:center;padding:2.2rem 1.2rem 3rem;border-bottom:6px solid var(--or)}
.logo{width:116px;height:116px;border-radius:50%;border:4px solid var(--or);background:#fff;object-fit:cover}
h1{font:900 clamp(1.7rem,8vw,3rem)/1.15 'Algerian','Cinzel Decorative',fantasy,serif;letter-spacing:.04em;margin:1rem 0 .4rem;color:var(--blanc);
  text-shadow:2px 2px 0 var(--bleu-fonce),4px 5px 6px rgba(0,0,0,.45)}
.devise{margin:0 auto 1.4rem;max-width:30ch;font-size:1.08rem;color:#dfe5ff}
.bouton{display:inline-block;border:0;border-radius:8px;background:var(--or);color:var(--bleu-fonce);font:800 1.05rem 'Nunito',sans-serif;padding:.8rem 1.7rem;text-decoration:none;cursor:pointer}
.bouton:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--or);outline-offset:3px}
main{max-width:60rem;margin:0 auto;padding:1.8rem 1rem 1rem}
h2{font:800 1.4rem/1.25 'Nunito',sans-serif;margin:0 0 .3rem}
.presente{margin:0 0 1.2rem;max-width:62ch}
.affiches{display:flex;gap:.9rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:.2rem .1rem 1rem;-webkit-overflow-scrolling:touch}
.affiches img{flex:0 0 74%;max-width:340px;width:74%;height:auto;border-radius:6px;scroll-snap-align:start;border:1px solid var(--ligne);background:var(--carte)}
.infos{display:grid;gap:1rem;margin-top:1rem}
.infos div{border-left:5px solid var(--bleu);background:var(--carte);padding:.8rem 1rem}
.infos p{margin:.15rem 0}
.infos a{color:inherit;font-weight:800}
footer{margin-top:2rem;background:var(--bleu-fonce);color:#cfd7f7;text-align:center;padding:1.2rem 1rem;font-size:.92rem}
/* connexion */
#vue-connexion{display:flex;align-items:center;justify-content:center;min-height:100vh;max-width:26rem;margin:0 auto;padding:2rem 1.2rem}
#vue-connexion .carte{width:100%;text-align:center}
#vue-connexion label{text-align:left}
#vue-connexion .icone{font-size:2.4rem;line-height:1}
#vue-connexion h1{font-size:1.7rem;color:var(--texte);margin:.4rem 0 .1rem;text-shadow:2px 2px 3px rgba(0,0,0,.25)}
#vue-connexion .sous{margin:0 0 .4rem;opacity:.8}
body:not(.espace){background:linear-gradient(135deg,#0c1f5c,#16358f) fixed}
#vue-espace{display:none;max-width:42rem;margin:0 auto;padding:2rem 1.2rem}
body.espace #vue-connexion{display:none}
body.espace #vue-espace{display:block}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:8px;padding:1.3rem}
label{display:block;font-weight:800;margin:1rem 0 .3rem}
select,input{width:100%;font:inherit;padding:.7rem;border:2px solid var(--bleu);border-radius:6px;background:var(--fond);color:var(--texte)}
#msg{min-height:1.5rem;margin:1rem 0 0;font-weight:600}
.retour{display:inline-block;margin-bottom:1rem;color:var(--bleu);font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .retour{color:var(--or)}}
@media (min-width:720px){.affiches img{flex-basis:300px;width:300px}.infos{grid-template-columns:1fr 1fr}}
.onglets{display:flex;gap:.5rem;margin:.8rem 0}
.onglet{flex:1;padding:.6rem;border:2px solid var(--bleu);border-radius:6px;background:transparent;color:var(--texte);font:800 .95rem 'Nunito',sans-serif;cursor:pointer}
.onglet.on{background:var(--bleu);color:#fff}
.ajout{display:grid;gap:.5rem;margin:1rem 0}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.6rem 0;border-top:1px solid var(--ligne)}
.nom{flex:1 1 10rem;display:flex;flex-direction:column}
.poste{font-size:.85rem;opacity:.75}
.petit{padding:.45rem .7rem;border:2px solid var(--bleu);border-radius:6px;background:transparent;color:var(--texte);font:800 .85rem 'Nunito',sans-serif;cursor:pointer}
.petit.on{background:var(--bleu);color:#fff}
.petit.rouge{border-color:#d64538;color:#d64538}
.bilan{font-weight:700;margin:.2rem 0 0}
.fini{display:flex;align-items:center;gap:.35rem;font-weight:700;font-size:.85rem;margin:0}
.horloge{font:800 2rem/1.1 'Nunito',sans-serif;letter-spacing:.04em;margin:.4rem 0 0;color:var(--bleu)}
.datelongue{margin:.1rem 0 .6rem;text-transform:capitalize}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .horloge{color:var(--or)}}
.hs{width:5.5rem;padding:.4rem}
.fini input{width:1.2rem;height:1.2rem;padding:0}
</style>
</head>
<body>
<div id="vue-connexion">
  <div class="carte">
    <div class="icone" aria-hidden="true">🍬</div>
    <h1>Romeo Business SARL</h1>
    <p class="sous">Gestion des présences</p>
    <label for="acces">Votre accès</label>
    <select id="acces">
      <option value="g1">Responsable groupe 1 (6h à 20h)</option>
      <option value="g2">Responsable groupe 2 (20h à 7h)</option>
      <option value="patron">Patron</option>
    </select>
    <label for="code">Code d’accès</label>
    <input id="code" type="password" autocomplete="current-password" inputmode="numeric">
    <p id="msg" role="status"></p>
    <button class="bouton" id="ok" type="button">Se connecter</button>
    <p style="margin:1.2rem 0 0"><button class="petit" id="demo" type="button">Voir la démonstration</button></p>
  </div>
</div>

<div id="vue-espace">
  <div class="carte">
    <h2 id="bienvenue">Connecté</h2>
    <p id="bandeauDemo" hidden style="background:var(--or);color:var(--bleu-fonce);font-weight:800;padding:.5rem .7rem;border-radius:6px">Mode démonstration : données fictives, rien n’est enregistré.</p>
    <p class="horloge" id="horloge" aria-label="Heure actuelle"></p>
    <p class="datelongue" id="dateLongue"></p>
    <div class="onglets" id="onglets"></div>
    <h3 id="titreGroupe" style="margin:.8rem 0 0"></h3>
    <p class="bilan" id="bilan"></p>
    <div class="ajout">
      <input id="nom" type="text" placeholder="Nom de l’employé" autocomplete="off">
      <select id="poste"><option value="rouleur">Rouleur de bonbons</option><option value="malaxeur">Malaxeur de pâte</option><option value="cuisinier">Cuisinier</option><option value="nettoyeur">Nettoyeur</option><option value="mesureur">Mesureur de lait</option></select>
      <button class="bouton" id="ajouter" type="button">Ajouter l’employé</button>
    </div>
    <p id="erreurEspace" role="status"></p>
    <div id="liste"></div>
    <h3 style="margin:1.4rem 0 .3rem">Heures supplémentaires de la semaine</h3>
    <div id="heures"></div>
    <h3 style="margin:1.4rem 0 .3rem">Nouveaux arrivants de la semaine</h3>
    <div id="nouveaux"></div>
    <button class="bouton" id="sortir" type="button" style="margin-top:1.2rem">Se déconnecter</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, addDoc, setDoc, updateDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* 1. Colle ici la configuration de ton projet Firebase (Paramètres du projet > Vos applications). */
const firebaseConfig = {
  apiKey: "AIzaSyA_GzkIQld2HYKPUs8RVZHE6XU81A2FgI8",
  authDomain: "romeo-business.firebaseapp.com",
  projectId: "romeo-business",
  storageBucket: "romeo-business.firebasestorage.app",
  messagingSenderId: "1035142658311",
  appId: "1:1035142658311:web:fee34d99aa92da7a7cada2"
};

/* 2. Les trois comptes à créer dans Firebase > Authentication. Le mot de passe de chaque compte est le code d’accès. */
const COMPTES = {
  g1:     { email: "groupe1@romeobusiness.app", nom: "Responsable groupe 1", groupe: 1 },
  g2:     { email: "groupe2@romeobusiness.app", nom: "Responsable groupe 2", groupe: 2 },
  patron: { email: "patron@romeobusiness.app",  nom: "Patron", groupe: 0 }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
function tic(){
  var n = new Date();
  document.getElementById('horloge').textContent = n.toLocaleTimeString('fr-FR');
  document.getElementById('dateLongue').textContent = n.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
tic(); setInterval(tic, 1000);
const msg = document.getElementById('msg');
const configure = firebaseConfig.apiKey !== "COLLE_ICI";
const app = configure ? initializeApp(firebaseConfig) : null;
const auth = app ? getAuth(app) : null;
/* Garde une copie sur l’appareil : les présences se saisissent sans réseau et partent dès le retour d’internet. */
const db = app ? initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }) : null;

function vue(){
  var h = location.hash;
  document.body.classList.toggle('espace', h === '#espace');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', vue);
vue();

function nomDuCompte(email){
  for (var k in COMPTES) if (COMPTES[k].email === email) return COMPTES[k].nom;
  return 'Connecté';
}

const POSTES = { rouleur: 'Rouleur de bonbons', malaxeur: 'Malaxeur de pâte', cuisinier: 'Cuisinier', nettoyeur: 'Nettoyeur', mesureur: 'Mesureur de lait' };
const aujourdhui = function(){ return new Date().toLocaleDateString('sv-SE'); };
const lundi = function(){ var d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toLocaleDateString('sv-SE'); };
let groupes = [], actif = 0, coupe = [], employes = [], presences = {}, semaine = [], demo = false, dEmp = [], dPres = {};

function el(t, c, x){ var n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; }
function compte(email){ for (var k in COMPTES) if (COMPTES[k].email === email) return COMPTES[k]; return null; }
function erreur(e){ document.getElementById('erreurEspace').textContent = 'Action refusée ou pas de réseau. Réessayez.'; console.error(e); }
function arreter(){ coupe.forEach(function(f){ f(); }); coupe = []; employes = []; presences = {}; semaine = []; }

function demarrer(c){
  demo = false; document.getElementById('bandeauDemo').hidden = true;
  groupes = c.groupe ? [c.groupe] : [1, 2];
  choisir(groupes[0]);
}
function choisir(g){
  arreter(); actif = g;
  if (demo) { demoCharger(); return; }
  coupe.push(onSnapshot(query(collection(db, 'employes'), where('groupe', '==', g), where('actif', '==', true)), function(s){
    employes = s.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); })
      .sort(function(a, b){ return a.nom.localeCompare(b.nom); });
    dessiner();
  }, erreur));
  coupe.push(onSnapshot(query(collection(db, 'presences'), where('groupe', '==', g), where('date', '==', aujourdhui())), function(s){
    presences = {};
    s.docs.forEach(function(d){ presences[d.data().employeId] = d.data(); });
    dessiner();
  }, erreur));
  coupe.push(onSnapshot(query(collection(db, 'presences'), where('groupe', '==', g), where('semaine', '==', lundi())), function(s){
    semaine = s.docs.map(function(d){ return d.data(); });
    dessiner();
  }, erreur));
  dessiner();
}
function demoCharger(){
  employes = dEmp.filter(function(e){ return e.groupe === actif && e.actif; })
    .sort(function(a, b){ return a.nom.localeCompare(b.nom); });
  presences = dPres;
  semaine = Object.keys(dPres).map(function(k){ return dPres[k]; }).concat([{ employeId: 'd0', heuresSup: 3 }, { employeId: 'd5', heuresSup: 2 }]);
  dessiner();
}
function demarrerDemo(){
  demo = true; arreter();
  var j = aujourdhui();
  dEmp = [['Jean Mbarga', 'rouleur', 1], ['Paul Essomba', 'malaxeur', 1], ['Marie Tchoua', 'rouleur', 1], ['Alain Fotso', 'malaxeur', 1],
          ['Éric Kamga', 'malaxeur', 2], ['Grace Ndjock', 'rouleur', 2], ['Hervé Ngono', 'rouleur', 2], ['Bruno Tchinda', 'malaxeur', 2]]
    .map(function(x, i){ return { id: 'd' + i, nom: x[0], poste: x[1], groupe: x[2], actif: true, arrivee: (i === 3 || i === 7) ? j : '2026-09-01' }; });
  dPres = {
    d0: { employeId: 'd0', groupe: 1, statut: 'present', heuresSup: 2 },
    d1: { employeId: 'd1', groupe: 1, statut: 'present', fini: true },
    d2: { employeId: 'd2', groupe: 1, statut: 'absent' },
    d4: { employeId: 'd4', groupe: 2, statut: 'present' },
    d5: { employeId: 'd5', groupe: 2, statut: 'present', heuresSup: 1.5 }
  };
  document.getElementById('bienvenue').textContent = 'Démonstration (Patron)';
  document.getElementById('bandeauDemo').hidden = false;
  groupes = [1, 2];
  location.hash = '#espace';
  choisir(1);
}
function dessiner(){
  var on = document.getElementById('onglets'); on.replaceChildren();
  if (groupes.length > 1) groupes.forEach(function(g){
    var b = el('button', 'onglet' + (g === actif ? ' on' : ''), 'Groupe ' + g);
    b.onclick = function(){ choisir(g); }; on.appendChild(b);
  });
  document.getElementById('titreGroupe').textContent = 'Groupe ' + actif + ' (' + (actif === 1 ? '6h à 20h' : '20h à 7h') + ')';
  var p = 0, a = 0, f = 0;
  var l = document.getElementById('liste'); l.replaceChildren();
  if (!employes.length) l.appendChild(el('p', '', 'Aucun employé pour l’instant.'));
  employes.forEach(function(e){
    var pr = presences[e.id] || {}, st = pr.statut; if (st === 'present') p++; if (st === 'absent') a++; if (st === 'present' && pr.fini) f++;
    var r = el('div', 'ligne'), n = el('div', 'nom');
    n.appendChild(el('strong', '', e.nom)); n.appendChild(el('span', 'poste', POSTES[e.poste] || e.poste));
    r.appendChild(n);
    [['present', 'Présent'], ['absent', 'Absent']].forEach(function(x){
      var b = el('button', 'petit' + (st === x[0] ? ' on' : ''), x[1]);
      b.onclick = function(){ marquer(e, x[0]); }; r.appendChild(b);
    });
    if (st === 'present') {
      var lab = el('label', 'fini'), cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!pr.fini;
      cb.onchange = function(){ terminer(e, cb.checked); };
      lab.appendChild(cb); lab.appendChild(document.createTextNode('A fini son service'));
      r.appendChild(lab);
    }
    if (st === 'present') {
      var hs = document.createElement('input');
      hs.type = 'number'; hs.min = '0'; hs.step = '0.5'; hs.className = 'hs';
      hs.placeholder = 'h sup'; hs.title = 'Heures supplémentaires du jour';
      hs.value = pr.heuresSup || '';
      hs.onchange = function(){ heuresSup(e, hs.value); };
      r.appendChild(hs);
    }
    var d = el('button', 'petit rouge', 'Démission'); d.onclick = function(){ demission(e); };
    r.appendChild(d); l.appendChild(r);
  });
  var tot = {};
  semaine.forEach(function(x){ if (x.heuresSup) tot[x.employeId] = (tot[x.employeId] || 0) + x.heuresSup; });
  var hz = document.getElementById('heures'); hz.replaceChildren();
  var avec = employes.filter(function(e){ return tot[e.id]; });
  if (!avec.length) hz.appendChild(el('p', '', 'Aucune heure supplémentaire cette semaine.'));
  avec.forEach(function(e){ hz.appendChild(el('p', '', e.nom + ' (' + (POSTES[e.poste] || e.poste) + ') : ' + tot[e.id] + ' h')); });
  var nv = document.getElementById('nouveaux'); nv.replaceChildren();
  var recents = employes.filter(function(e){ return e.arrivee >= lundi(); });
  if (!recents.length) nv.appendChild(el('p', '', 'Aucun nouvel arrivant cette semaine.'));
  recents.forEach(function(e){ nv.appendChild(el('p', '', e.nom + ' (' + (POSTES[e.poste] || e.poste) + '), arrivé le ' + e.arrivee)); });
  document.getElementById('bilan').textContent = 'Aujourd’hui : ' + p + ' présents, ' + a + ' absents, ' + (employes.length - p - a) + ' non marqués, ' + f + ' ont fini leur service';
}
function marquer(e, s){
  if (demo) { dPres[e.id] = { employeId: e.id, groupe: e.groupe, statut: s }; demoCharger(); return; }
  document.getElementById('erreurEspace').textContent = '';
  setDoc(doc(db, 'presences', aujourdhui() + '_' + e.id), { employeId: e.id, groupe: e.groupe, date: aujourdhui(), semaine: lundi(), statut: s, maj: serverTimestamp() }).catch(erreur);
}
function terminer(e, v){
  if (demo) { dPres[e.id] = Object.assign({}, dPres[e.id], { fini: v }); demoCharger(); return; }
  document.getElementById('erreurEspace').textContent = '';
  setDoc(doc(db, 'presences', aujourdhui() + '_' + e.id), { employeId: e.id, groupe: e.groupe, date: aujourdhui(), semaine: lundi(), statut: 'present', fini: v, maj: serverTimestamp() }, { merge: true }).catch(erreur);
}
function heuresSup(e, v){
  if (demo) { dPres[e.id] = Object.assign({}, dPres[e.id], { heuresSup: Math.max(0, Number(v) || 0) }); demoCharger(); return; }
  document.getElementById('erreurEspace').textContent = '';
  setDoc(doc(db, 'presences', aujourdhui() + '_' + e.id), { employeId: e.id, groupe: e.groupe, date: aujourdhui(), semaine: lundi(), statut: 'present', heuresSup: Math.max(0, Number(v) || 0), maj: serverTimestamp() }, { merge: true }).catch(erreur);
}
function demission(e){
  if (!confirm('Enregistrer la démission de ' + e.nom + ' ?')) return;
  if (demo) { e.actif = false; demoCharger(); return; }
  updateDoc(doc(db, 'employes', e.id), { actif: false, demission: aujourdhui() }).catch(erreur);
}
document.getElementById('ajouter').addEventListener('click', function(){
  var champ = document.getElementById('nom'), nom = champ.value.trim();
  if (!nom) { document.getElementById('erreurEspace').textContent = 'Écrivez le nom de l’employé.'; return; }
  if (demo) { dEmp.push({ id: 'd' + Date.now(), nom: nom, poste: document.getElementById('poste').value, groupe: actif, actif: true, arrivee: aujourdhui() }); champ.value = ''; demoCharger(); return; }
  document.getElementById('erreurEspace').textContent = '';
  addDoc(collection(db, 'employes'), { nom: nom, poste: document.getElementById('poste').value, groupe: actif, actif: true, arrivee: aujourdhui(), creeLe: serverTimestamp() }).catch(erreur);
  champ.value = '';
});

if (auth) {
  onAuthStateChanged(auth, function(u){
    if (u) {
      document.getElementById('bienvenue').textContent = nomDuCompte(u.email);
      var c = compte(u.email); if (c) demarrer(c);
      location.hash = '#espace';
    } else if (location.hash === '#espace' && !demo) {
      location.hash = '#connexion';
    }
  });
}

document.getElementById('demo').addEventListener('click', demarrerDemo);
document.getElementById('ok').addEventListener('click', async function(){
  var code = document.getElementById('code').value;
  var cle = document.getElementById('acces').value;
  if (!auth) { msg.textContent = 'Firebase n’est pas encore configuré dans ce fichier.'; return; }
  if (!code) { msg.textContent = 'Entrez votre code d’accès.'; return; }
  msg.textContent = 'Connexion en cours…';
  try {
    await signInWithEmailAndPassword(auth, COMPTES[cle].email, code);
    document.getElementById('code').value = '';
    msg.textContent = '';
    location.hash = '#espace';
  } catch (e) {
    msg.textContent = (e.code === 'auth/network-request-failed')
      ? 'Pas de réseau. La connexion demande internet.'
      : 'Code incorrect pour cet accès.';
  }
});

document.getElementById('sortir').addEventListener('click', async function(){
  demo = false; document.getElementById('bandeauDemo').hidden = true;
  arreter();
  if (auth) await signOut(auth);
  location.hash = '#connexion';
});
</script>
</body>
</html>
